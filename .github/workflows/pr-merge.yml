name: Publish Schemas

on:
  pull_request:
    branches:
      - 'main'
  push:
    branches:
      - 'main'

jobs:

  publish-docs:
    name: Publish Schemas
    uses: ./.github/workflows/gh-pages.yml
    with:
      deploy: ${{ github.event_name == 'push' }}
    permissions:
      contents: read
      pages: write
      id-token: write
